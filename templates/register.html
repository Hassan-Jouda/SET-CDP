<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>إنشاء حساب | SET-CDP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/static/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .register-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    .register-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .register-title h1 {
      font-weight: 900;
      color: #0f172a;
    }

    .register-title p {
      color: #64748b;
      margin: 0;
    }
  </style>
</head>

<body>

<div class="register-card">
  <div class="register-title">
    <h1>🛡️ SET-CDP</h1>
    <p>إنشاء حساب مستخدم جديد</p>
  </div>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post">
    <label class="form-label">اسم المستخدم</label>
    <input name="username" class="form-control mb-3" required>

    <label class="form-label">كلمة المرور</label>
    <input name="password" type="password" class="form-control mb-3" required>

    <label class="form-label">تأكيد كلمة المرور</label>
    <input name="confirm_password" type="password" class="form-control mb-3" required>

    <button class="btn btn-success w-100 mb-2">إنشاء الحساب</button>
    <a class="btn btn-outline-primary w-100 mb-2" href="/login">لدي حساب بالفعل</a>
    <a class="btn btn-outline-secondary w-100" href="/">العودة للصفحة الرئيسية</a>
  </form>
</div>

</body>
</html>
