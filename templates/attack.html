<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>الاختبار التعليمي</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head>
    <body>{% include 'base_nav.html' %}<main class="container py-5"><div class="row g-4"><div class="col-lg-6">
            <div class="card"><div class="card-body"><h3>نسخ تدريبي لموقع</h3><input id="cloneUrl" class="form-control mb-2" placeholder="https://example.com/login"><input id="cloneName" class="form-control mb-2" placeholder="scenario_name"><button class="btn btn-danger w-100" onclick="cloneSite()">إنشاء نسخة تدريبية</button><div id="cloneResult" class="mt-3"></div></div></div></div><div class="col-lg-6"><div class="card"><div class="card-body"><h3>قوالب جاهزة</h3><a class="btn btn-outline-primary m-1" target="_blank" href="/social/facebook">Facebook</a><a class="btn btn-outline-danger m-1" target="_blank" href="/social/instagram">Instagram</a><a class="btn btn-outline-info m-1" target="_blank" href="/social/linkedin">LinkedIn</a><a class="btn btn-outline-dark m-1" target="_blank" href="/social/university">University</a></div></div></div></div><div class="card mt-4"><div class="card-body"><h3>النسخ الموجودة</h3>{% if clones %}<ul>{% for c in clones %}<li><a target="_blank" href="/view-clone/{{c.clone_name}}">{{c.clone_name}}</a> <button class="btn btn-sm btn-outline-danger" onclick="deleteClone('{{c.clone_name}}')">حذف</button></li>{% endfor %}</ul>{% else %}<p>لا توجد نسخ بعد.</p>{% endif %}</div></div></main><script src="/static/script.js"></script></body></html>
