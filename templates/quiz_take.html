<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تقديم الامتحان</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% include 'base_nav.html' %}

<main class="container py-5">
  <h1>امتحان التوعية الأمنية</h1>
  <p>الطالب: <b>{{ name }}</b></p>

  <form method="post">
    {% for q in questions %}
    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h5>{{ loop.index }}. {{ q.q }}</h5>

        {% for option in q.a %}
        <div class="form-check">
          <input class="form-check-input" type="radio" name="q{{ q.id }}" value="{{ loop.index0 }}" required>
          <label class="form-check-label">{{ option }}</label>
        </div>
        {% endfor %}
      </div>
    </div>
    {% endfor %}

    <button class="btn btn-success w-100">تسليم الامتحان</button>
  </form>
</main>
</body>
</html>
