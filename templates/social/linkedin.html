<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linkedin Training Login</title><style>body{font-family:Arial;background:#f0f2f5;margin:0}.banner{background:#dc3545;color:white;text-align:center;padding:12px;font-weight:bold}.box{max-width:420px;margin:70px auto;background:white;padding:28px;border-radius:14px;box-shadow:0 8px 25px #0002}input,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #ddd}button{background:#0d6efd;color:white;border:0;font-weight:bold}.muted{color:#666;font-size:13px}</style></head><body><div class="banner">🎓 ACADEMIC TRAINING SIMULATION - No real password is stored</div><div class="box"><h1>Linkedin</h1><p class="muted">Training template for awareness only.</p><form id="f"><input name="email" placeholder="Email or username" required><input name="password" type="password" placeholder="Password" required><button type="submit">Login</button></form></div><script>document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(e.target);var username=fd.get('email')||fd.get('username')||'';fetch('/api/social-capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({site:'linkedin',form_data:{username:username,password:'[NOT STORED - TRAINING]'}})}).finally(()=>location.href='/awareness-training')});</script></body></html>
