<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>نتيجة الامتحان</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% include 'base_nav.html' %}

<main class="container py-5">
  <div class="card shadow text-center">
    <div class="card-body">
      <h1>نتيجة الامتحان</h1>
      <h3>{{ name }}</h3>

      <p>Score: {{ score }}/{{ total }}</p>
      <h2>{{ percentage }}%</h2>

      <div class="alert alert-info">{{ status }}</div>

      {% if percentage >= 70 %}
      <div class="border rounded p-4 mt-4">
        <h2>Certificate</h2>
        <p>This certifies that</p>
        <h3>{{ name }}</h3>
        <p>has successfully completed the Cyber Awareness Quiz</p>
        <h4>Cyber Awareness Passed</h4>
      </div>
      {% endif %}

      <button class="btn btn-outline-primary mt-3" onclick="window.print()">طباعة / حفظ PDF</button>
      <a class="btn btn-secondary mt-3" href="/quiz">إعادة الامتحان</a>
    </div>
  </div>
</main>

</body>
</html>
