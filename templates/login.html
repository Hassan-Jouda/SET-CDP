<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تسجيل الدخول | SET-CDP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/static/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    .login-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-title h1 {
      font-weight: 900;
      color: #0f172a;
    }

    .login-title p {
      color: #64748b;
      margin: 0;
    }
  </style>
</head>

<body>

<div class="login-card">
  <div class="login-title">
    <h1>🛡️ SET-CDP</h1>
    <p>تسجيل الدخول إلى المنصة</p>
  </div>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post">
    <label class="form-label">اسم المستخدم</label>
    <input name="username" class="form-control mb-3" required>

    <label class="form-label">كلمة المرور</label>
    <input name="password" type="password" class="form-control mb-3" required>

    <button class="btn btn-primary w-100">دخول</button>
  </form>
<div class="d-grid gap-2 mt-3">
  <a class="btn btn-outline-secondary" href="/">العودة للصفحة الرئيسية</a>
  <a class="btn btn-outline-success" href="/register">إنشاء حساب جديد</a>
</div>
  <div class="text-center mt-3">
    <small class="text-muted">Academic Cybersecurity Training Platform</small>
  </div>
</div>

</body>
</html>
